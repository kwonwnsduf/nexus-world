name: nexus-world

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      CORE_API_URL: http://core-api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  core-api:
    build:
      context: services/core-api
    environment:
      SERVER_PORT: 8080
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexusworld}
      DATABASE_USER: ${POSTGRES_USER:-nexusworld}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-nexusworld-local-only}
      JWT_ISSUER: ${JWT_ISSUER:-nexus-world-core-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexus-world-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-bmV4dXMtd29ybGQtbG9jYWwtand0LXNlY3JldC0zMmJ5dGVzLQ==}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-nexus-world-local-admin}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      UN_COMTRADE_API_KEY: ${UN_COMTRADE_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexusworld-local-only}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_QUERY_LIMIT: ${NEO4J_QUERY_LIMIT:-100}
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ai-service:
    build:
      context: services/ai-service
    environment:
      CORE_API_URL: http://core-api:8080
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-nexusworld}:${POSTGRES_PASSWORD:-nexusworld-local-only}@postgres:5432/${POSTGRES_DB:-nexusworld}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_TIMEOUT_SECONDS: ${OPENAI_EMBEDDING_TIMEOUT_SECONDS:-30}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusworld}
      POSTGRES_USER: ${POSTGRES_USER:-nexusworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusworld-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: ["platform"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    profiles: ["platform"]
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-nexusworld-local-only}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7474"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.3.10
    profiles: ["platform"]
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:${REDPANDA_PORT:-19092}
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
