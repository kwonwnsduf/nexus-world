name: nexus-world

services:
  web:
    image: nexus-world-web:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      CORE_API_URL: http://core-api:8080
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-true}
      DEMO_USERNAME: ${DEMO_USERNAME:?DEMO_USERNAME is required}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD is required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  core-api:
    image: nexus-world-core-api:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ../../services/core-api
    environment:
      SERVER_PORT: 8080
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_ISSUER: ${JWT_ISSUER:-nexus-world-core-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-nexus-world-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      UN_COMTRADE_API_KEY: ${UN_COMTRADE_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      INGESTION_SCHEDULE_ENABLED: ${INGESTION_SCHEDULE_ENABLED:-false}
      INGESTION_SCHEDULE_ACTOR_ID: ${INGESTION_SCHEDULE_ACTOR_ID:-}
      INGESTION_SCHEDULE_POLL_DELAY: ${INGESTION_SCHEDULE_POLL_DELAY:-PT1M}
      INGESTION_SCHEDULE_SOURCES_JSON: '${INGESTION_SCHEDULE_SOURCES_JSON:-{}}'
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ai-service:
    image: nexus-world-ai-service:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ../../services/ai-service
    environment:
      CORE_API_URL: http://core-api:8080
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_TIMEOUT_SECONDS: ${OPENAI_EMBEDDING_TIMEOUT_SECONDS:-30}
      OPENAI_SCENARIO_MODEL: ${OPENAI_SCENARIO_MODEL:-gpt-4.1-mini}
      OPENAI_SCENARIO_TIMEOUT_SECONDS: ${OPENAI_SCENARIO_TIMEOUT_SECONDS:-30}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
